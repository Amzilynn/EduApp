<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Audio Variants Tester</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Noto+Sans+Arabic:wght@400;700&display=swap');
        
        body { 
            font-family: 'Outfit', 'Noto Sans Arabic', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            padding: 40px 20px; 
            color: #2d3436; 
            min-height: 100vh;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        
        h1 { 
            color: #0984e3; 
            margin-bottom: 30px; 
            text-align: center; 
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .voice-section { 
            margin-bottom: 50px; 
        }
        
        .voice-title { 
            font-size: 1.8rem; 
            color: #636e72; 
            border-bottom: 2px solid #0984e3; 
            padding-bottom: 10px; 
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .voice-title::before {
            content: '';
            width: 12px;
            height: 12px;
            background: #0984e3;
            border-radius: 50%;
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
        }
        
        .row { 
            background: white; 
            border: 1px solid #dfe6e9; 
            padding: 20px; 
            border-radius: 16px; 
            display: grid;
            grid-template-columns: 200px 1fr 1fr 1fr;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }
        
        .row:hover {
            transform: scale(1.01);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-color: #0984e3;
        }
        
        .label-container {
            display: flex;
            flex-direction: column;
        }

        .key-name { 
            font-weight: 600; 
            font-size: 1.1rem;
            color: #2d3436;
        }
        
        .arabic-text {
            font-size: 0.9rem;
            color: #636e72;
            margin-top: 4px;
        }

        button { 
            background: #0984e3; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        button:hover { 
            background: #074b83; 
            transform: translateY(-2px);
        }

        button.playing {
            background: #00b894;
        }

        .controls {
            position: sticky;
            top: 20px;
            z-index: 100;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arabic Audio Validation (Fusha)</h1>
        
        <div id="girl-section" class="voice-section">
            <h2 class="voice-title">Girl Voice (Salma Style)</h2>
            <div id="girl-grid" class="grid"></div>
        </div>

        <div id="boy-section" class="voice-section">
            <h2 class="voice-title">Boy Voice (Shakir Style)</h2>
            <div id="boy-grid" class="grid"></div>
        </div>
    </div>

    <script>
        const data = {
            girl: {
                repeat_again: "أَعِدْ مَرَّةً أُخْرَى",
                where_is_blue_square: "أَيْنَ الْمُرَبَّعُ الْأَزْرَقُ؟",
                where_is_green_rectangle: "أَيْنَ الْمُسْتَطِيلُ الْأَخْضَرُ؟",
                bravo: "أَحْسَنْتِ!",
                rouge: "أَحْمَر",
                jaune: "أَصْفَر",
                green: "أَخْضَر",
                pink: "وَرْدِيّ",
                marron: "بُنِّيّ",
                purple: "بَنَفْسَجِيّ",
                rectangle: "مُسْتَطِيل",
                triangle: "مُثَلَّث",
                mix_colors: "اِخْلِطِ الْأَلْوَانَ لِتَجِدَ النَّتِيجَةَ الصَّحِيحَةَ",
                alif: "أَلِف", baa: "بَاء", taa: "تَاء", thaa: "ثَاء", jeem: "جِيم",
                haa_soft: "حَاء", khaa: "خَاء", daal: "دَال", thaal: "ذَال", raa: "رَاء",
                zay: "زَاي", seen: "سِين", sheen: "شِين", saad: "صَاد", daad: "ضَاد",
                taa_hard: "طَاء", zaa: "ظَاء", ayn: "عَيْن", ghayn: "غَيْن", faa: "فَاء",
                qaaf: "قَاف", kaaf: "كَاف", laam: "لاَم", meem: "مِيم", noon: "نُون",
                haa: "هَاء", waw: "وَاو", yaa: "يَاء"
            },
            boy: {
                father: "أَب",
                grandfather: "جَدّ",
                bravo: "أَحْسَنْتَ!",
                rectangle: "مُسْتَطِيل",
                triangle: "مُثَلَّث",
                marron: "بُنِّيّ",
                pink: "وَرْدِيّ",
                purple: "بَنَفْسَجِيّ",
                gris: "رَمَادِيّ",
                where_is_blue_square: "أَيْنَ الْمُرَبَّعُ الْأَزْرَقُ؟",
                where_is_green_rectangle: "أَيْنَ الْمُسْتَطِيلُ الْأَخْضَرُ؟"
            }
        };

        function createGrid(voice) {
            const grid = document.getElementById(`${voice}-grid`);
            const phrases = data[voice];

            for (const [key, text] of Object.entries(phrases)) {
                const row = document.createElement('div');
                row.className = 'row';
                
                row.innerHTML = `
                    <div class="label-container">
                        <span class="key-name">${key}</span>
                        <span class="arabic-text">${text}</span>
                    </div>
                    <button onclick="play('${voice}', '${key}', 1, this)">V1</button>
                    <button onclick="play('${voice}', '${key}', 2, this)">V2</button>
                    <button onclick="play('${voice}', '${key}', 3, this)">V3</button>
                `;
                grid.appendChild(row);
            }
        }

        function play(voice, key, version, btn) {
            const path = `recordings/ar/${voice}/${key}_v${version}.wav`;
            const audio = new Audio(path);
            
            btn.classList.add('playing');
            audio.play()
                .then(() => {
                    audio.onended = () => btn.classList.remove('playing');
                })
                .catch(e => {
                    console.error("Audio not found:", path);
                    btn.classList.remove('playing');
                    btn.style.background = '#ff7675';
                    setTimeout(() => btn.style.background = '', 1000);
                });
        }

        createGrid('girl');
        createGrid('boy');
    </script>
</body>
</html>
